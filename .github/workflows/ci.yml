# Checks every pull request into main, and main itself after a merge (KAN-281).
# Branch protection on main requires these jobs to pass before a pull request can be merged:
# API tests, Frontend checks and Browser tests.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to Ubuntu 24.04 rather than ubuntu-latest, which moves to Ubuntu 26 from
# 19 October 2026, so the checks don't change under us. The actions are versions that run on Node 24.
jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahebbazar
          # Opening hours and "open now" are computed in Dhaka time, as in docker-compose.yml.
          TZ: Asia/Dhaka
          PGTZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahebbazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shahebbazar
      OTP_HASH_SECRET: ci-only-otp-secret
      ANALYTICS_SALT: ci-only-salt
      MOCK_VERIFICATION_DELIVERY: console

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: backend
      # Builds a throwaway shahebbazar_test database from the baseline and runs every API test.
      - name: Test
        run: npm test
        working-directory: backend

  web:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/shahebbazar/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend/shahebbazar
      - name: Lint
        run: npx eslint .
        working-directory: frontend/shahebbazar
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend/shahebbazar
      - name: Build
        run: npx next build
        working-directory: frontend/shahebbazar

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahebbazar
          TZ: Asia/Dhaka
          PGTZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahebbazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shahebbazar
      OTP_HASH_SECRET: ci-only-otp-secret
      ANALYTICS_SALT: ci-only-salt

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/shahebbazar/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend/shahebbazar
          npm ci --prefix e2e
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Loads a throwaway database, builds the site, starts the API and the site, and runs every
      # browser test on a desktop and a phone-sized screen (e2e/README.md).
      - name: Test
        run: npx playwright test
        working-directory: e2e
      # Screenshots, step-by-step traces and the API log, for working out why a test failed.
      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
