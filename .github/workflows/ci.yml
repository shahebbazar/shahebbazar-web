# Checks every pull request into main, and main itself after a merge (KAN-281).
# Branch protection on main requires these jobs to pass before a pull request can be merged:
# API tests, Frontend checks and Browser tests.
# Once they pass on main, the Deploy job updates the test server (docs/DEPLOY.md).
# Run workflow (Actions tab) on main re-runs the checks and deploys again.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Runs on main aren't cancelled, so a deploy
# is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned to Ubuntu 24.04 rather than ubuntu-latest, which moves to Ubuntu 26 from
# 19 October 2026, so the checks don't change under us. The actions are versions that run on Node 24.
jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahebbazar
          # Opening hours and "open now" are computed in Dhaka time, as in docker-compose.yml.
          TZ: Asia/Dhaka
          PGTZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahebbazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shahebbazar
      OTP_HASH_SECRET: ci-only-otp-secret
      ANALYTICS_SALT: ci-only-salt
      MOCK_VERIFICATION_DELIVERY: console

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: backend
      # Builds a throwaway shahebbazar_test database from the baseline and runs every API test.
      - name: Test
        run: npm test
        working-directory: backend

  web:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/shahebbazar/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend/shahebbazar
      - name: Lint
        run: npx eslint .
        working-directory: frontend/shahebbazar
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend/shahebbazar
      - name: Build
        run: npx next build
        working-directory: frontend/shahebbazar

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahebbazar
          TZ: Asia/Dhaka
          PGTZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahebbazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shahebbazar
      OTP_HASH_SECRET: ci-only-otp-secret
      ANALYTICS_SALT: ci-only-salt

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/shahebbazar/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend/shahebbazar
          npm ci --prefix e2e
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Loads a throwaway database, builds the site, starts the API and the site, and runs every
      # browser test on a desktop and a phone-sized screen (e2e/README.md).
      - name: Test
        run: npx playwright test
        working-directory: e2e
      # Screenshots, step-by-step traces and the API log, for working out why a test failed.
      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Updates the test server with main, once every check has passed. Over SSH with a key that can
  # only run deploy/deploy.sh (docs/DEPLOY.md). Until the test-server environment's secrets are
  # set, it notes that and passes.
  deploy:
    name: Deploy to the test server
    needs: [api, web, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: test-server
      url: ${{ vars.TEST_SERVER_URL }}
    concurrency:
      group: deploy-test-server
      cancel-in-progress: false

    steps:
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::The test server's secrets aren't set (docs/DEPLOY.md), so nothing was deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          # The key as one line of base64 (base64 -w0, docs/DEPLOY.md), or pasted as is. Pasting from a
          # terminal can add carriage returns and spaces at line ends, which ssh can't read, so those go.
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/deploy_key
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY isn't a readable private key. Set it again as described in docs/DEPLOY.md step 6."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "ubuntu@$DEPLOY_HOST" "$GITHUB_SHA"
