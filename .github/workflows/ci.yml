# Checks every pull request into main, and main itself after a merge (KAN-281).
# Branch protection on main requires these jobs to pass before a pull request can be merged:
# API tests, Frontend checks and Browser tests.
# Once they pass on main, Deploy to staging updates the staging site on the client's server
# (docs/DEPLOY-CLIENT.md).
# Run workflow (Actions tab) runs the checks on the chosen branch, then deploys it to the test site on
# the client's server, to the AWS test server (docs/DEPLOY.md), or, for main only, to staging again.
# The live site is never deployed from here: only by hand on the server, as the client asked.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to:
        description: Where to deploy the branch once the checks pass (staging takes main only)
        type: choice
        options: [test site, test server, staging]
        default: test site

# A newer push to a pull request cancels its older run. Runs on main aren't cancelled, so a deploy
# is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned to Ubuntu 24.04 rather than ubuntu-latest, which moves to Ubuntu 26 from
# 19 October 2026, so the checks don't change under us. The actions are versions that run on Node 24.
jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahebbazar
          # Opening hours and "open now" are computed in Dhaka time, as in docker-compose.yml.
          TZ: Asia/Dhaka
          PGTZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahebbazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shahebbazar
      OTP_HASH_SECRET: ci-only-otp-secret
      ANALYTICS_SALT: ci-only-salt
      MOCK_VERIFICATION_DELIVERY: console

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: backend
      # Builds a throwaway shahebbazar_test database from the baseline and runs every API test.
      - name: Test
        run: npm test
        working-directory: backend

  web:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/shahebbazar/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend/shahebbazar
      - name: Lint
        run: npx eslint .
        working-directory: frontend/shahebbazar
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend/shahebbazar
      - name: Build
        run: npx next build
        working-directory: frontend/shahebbazar

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shahebbazar
          TZ: Asia/Dhaka
          PGTZ: Asia/Dhaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shahebbazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: shahebbazar
      OTP_HASH_SECRET: ci-only-otp-secret
      ANALYTICS_SALT: ci-only-salt

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/shahebbazar/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend/shahebbazar
          npm ci --prefix e2e
      # Only Playwright's headless Chromium, kept between runs until the Playwright version changes.
      # No --with-deps: that ran apt-get on every run (4 to 7 minutes, depending on Ubuntu's mirrors)
      # for libraries the runner image already has, since it ships with Google Chrome.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
        working-directory: e2e
      # Loads a throwaway database, builds the site, starts the API and the site, and runs every
      # browser test on a desktop and a phone-sized screen (e2e/README.md).
      - name: Test
        run: npx playwright test
        working-directory: e2e
      # Screenshots, step-by-step traces and the API log, for working out why a test failed.
      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Updates the test server with the branch someone chose in Actions → CI → Run workflow, once every
  # check has passed. Pushes and merges don't touch it. Over SSH with a key that can only run
  # deploy/deploy.sh (docs/DEPLOY.md). Until the test-server environment's secrets are set, it notes
  # that and passes.
  deploy:
    name: Deploy to the test server
    needs: [api, web, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to == 'test server'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: test-server
      url: ${{ vars.TEST_SERVER_URL }}
    concurrency:
      group: deploy-test-server
      cancel-in-progress: false

    steps:
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::The test server's secrets aren't set (docs/DEPLOY.md), so nothing was deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          # The key as one line of base64 (base64 -w0, docs/DEPLOY.md), or pasted as is. Pasting from a
          # terminal can add carriage returns and spaces at line ends, which ssh can't read, so those go.
          if printf '%s' "$DEPLOY_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/deploy_key
          else
            printf '%s' "$DEPLOY_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::DEPLOY_SSH_KEY isn't a readable private key. Set it again as described in docs/DEPLOY.md step 6."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "ubuntu@$DEPLOY_HOST" "$GITHUB_SHA"

  # Updates the staging site on the client's server (staging.shahebbazar.com) with main, once every
  # check has passed, after each push to main or when Run workflow on main chooses staging. Over SSH
  # with a key that can only run deploy/client/deploy.sh (docs/DEPLOY-CLIENT.md, "Automatic
  # deploys"). Until the staging environment's secrets are set, it notes that and passes.
  deploy-staging:
    name: Deploy to staging
    needs: [api, web, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_to == 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.shahebbazar.com
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "::notice::The staging environment's secrets aren't set (docs/DEPLOY-CLIENT.md), so nothing was deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          if printf '%s' "$STAGING_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$STAGING_SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/staging_key
          else
            printf '%s' "$STAGING_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/staging_key
          fi
          chmod 600 ~/.ssh/staging_key
          if ! ssh-keygen -y -f ~/.ssh/staging_key > /dev/null; then
            echo "::error::STAGING_SSH_KEY isn't a readable private key. Set it again as described in docs/DEPLOY-CLIENT.md."
            exit 1
          fi
          printf '%s\n' "$STAGING_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/staging_key -o BatchMode=yes -o ServerAliveInterval=30 "$STAGING_USER@$STAGING_HOST" "$GITHUB_SHA"

      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/client
      # From outside, as a visitor (deploy/client/check-site.sh).
      - name: Check the staging site
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "::notice::Nothing was deployed, so there is nothing to check."
            exit 0
          fi
          sh deploy/client/check-site.sh https://staging.shahebbazar.com

  # Updates the test site on the client's server (test.shahebbazar.com) with the branch someone chose
  # in Actions → CI → Run workflow, once every check has passed. Over SSH with a key that can only run
  # the test site's deploy/client/deploy.sh (docs/DEPLOY-CLIENT.md, "Automatic deploys"). Until the
  # test-site environment's secrets are set, it notes that and passes.
  deploy-test-site:
    name: Deploy to the test site
    needs: [api, web, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to == 'test site'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: test-site
      url: https://test.shahebbazar.com
    concurrency:
      group: deploy-test-site
      cancel-in-progress: false

    steps:
      - name: Deploy
        env:
          TEST_SITE_HOST: ${{ secrets.TEST_SITE_HOST }}
          TEST_SITE_USER: ${{ secrets.TEST_SITE_USER }}
          TEST_SITE_SSH_KEY: ${{ secrets.TEST_SITE_SSH_KEY }}
          TEST_SITE_KNOWN_HOSTS: ${{ secrets.TEST_SITE_KNOWN_HOSTS }}
        run: |
          if [ -z "$TEST_SITE_HOST" ]; then
            echo "::notice::The test-site environment's secrets aren't set (docs/DEPLOY-CLIENT.md), so nothing was deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          if printf '%s' "$TEST_SITE_SSH_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$TEST_SITE_SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > ~/.ssh/test_site_key
          else
            printf '%s' "$TEST_SITE_SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/test_site_key
          fi
          chmod 600 ~/.ssh/test_site_key
          if ! ssh-keygen -y -f ~/.ssh/test_site_key > /dev/null; then
            echo "::error::TEST_SITE_SSH_KEY isn't a readable private key. Set it again as described in docs/DEPLOY-CLIENT.md."
            exit 1
          fi
          printf '%s\n' "$TEST_SITE_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/test_site_key -o BatchMode=yes -o ServerAliveInterval=30 "$TEST_SITE_USER@$TEST_SITE_HOST" "$GITHUB_SHA"

      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/client
      # From outside, as a visitor (deploy/client/check-site.sh).
      - name: Check the test site
        env:
          TEST_SITE_HOST: ${{ secrets.TEST_SITE_HOST }}
        run: |
          if [ -z "$TEST_SITE_HOST" ]; then
            echo "::notice::Nothing was deployed, so there is nothing to check."
            exit 0
          fi
          sh deploy/client/check-site.sh https://test.shahebbazar.com
