# Copy to docker-compose.yml in the site's workspace on the client's server, for example
# /var/www/apps/shahebbazar-prod/docker-compose.yml (docs/DEPLOY-CLIENT.md). project-ctl runs the
# workspace's docker-compose.yml; this one pulls in the real file from the repository clone in app/,
# so `git pull` updates it. Settings come from the workspace's .env.

# PROJECT in .env, the workspace's name. It keeps each site's data volumes (<PROJECT>_pgdata,
# <PROJECT>_uploads) apart and the same however it is run. Staging leaves it out: shahebbazar.
name: ${PROJECT:-shahebbazar}

include:
  - path: app/deploy/client/docker-compose.yml
    env_file: .env
